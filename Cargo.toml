[workspace]
resolver = "2"
members = ["crates/cli", "crates/delta-core",
     "crates/delta-core",
     "crates/storage-sqlite",
    "crates/server",
    "crates/storage-sqlite",
     "crates/cli",
]


[workspace.package]
version = "0.1.0"
edition = "2024"         # if your compiler complains, change to "2021"
license = "MIT"
authors = ["Even Ytterli Tokle <Even@Tokle.io>"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tracing = "0.1"
async-trait = "0.1"
thiserror = "2"
rusqlite = { version = "0.37", features = ["uuid", "chrono"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.31.0"