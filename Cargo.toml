[workspace]
resolver = "2"
members = ["crates/cli", "crates/delta-core",
    "crates/delta-api",
    "crates/storage-diesel",
    "crates/server",
    "crates/tui",
]


[workspace.package]
version = "0.1.0"
edition = "2024"         # if your compiler complains, change to "2021"
license = "MIT"
authors = ["Even Ytterli Tokle <Even@Tokle.io>"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
async-trait = "0.1"
thiserror = "2"
dotenvy = "0.15"
base64 = "0.23"
ratatui = "0.30"
crossterm = "0.29"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
