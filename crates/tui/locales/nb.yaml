# Norsk bokmål (nb) locale for the DeltaBeer TUI.
#
# Keys are looked up with `rust-i18n`; only user-facing text lives
# here; Rust identifiers, API fields, DB names, enum variants, config keys, and
# protocol values stay in the source code.
#
# `%{name}`, `%{amount}`, and `%{id}` are placeholders substituted at runtime and
# may be repositioned to suit the language.

